<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Intern</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark">▣</span>
      <span class="topbar-title">DS-INTERN</span>
    </div>
    <div class="topbar-meta" id="row-count">{{ row_count | default(0) }} rows loaded</div>
  </header>

  <main class="layout">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
